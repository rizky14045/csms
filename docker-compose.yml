services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sidak_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-sidak}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sidak

  nginx:
    image: nginx:alpine
    container_name: sidak_nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www:ro
    depends_on:
      - app
    networks:
      - sidak

  db:
    image: postgres:17-alpine
    container_name: sidak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sidak}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-sidak}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sidak

networks:
  sidak:
    driver: bridge

volumes:
  postgres_data:
    driver: local

